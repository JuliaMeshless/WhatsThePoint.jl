name: Documentation

on:
  push:
    branches:
      - main
    tags: "*"
  pull_request:
  workflow_dispatch:

# All runs deploy to the same gh-pages branch, so serialize them: a main build
# and a tag build have different refs and would otherwise race to push.
concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # DocumenterVitepress runs `git tag` to decide whether the version being
          # built earns the `stable` alias; a shallow checkout hides the tag list.
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.11"
      - uses: julia-actions/cache@v3
      - name: Install dependencies
        run: julia --project=docs/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # If authenticating with GitHub Actions token
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }} # If authenticating with SSH deploy key
        run: julia --project=docs/ docs/make.jl
      - name: Run doctests
        run: |
          julia --project=docs -e '
            using Documenter: DocMeta, doctest
            using WhatsThePoint
            DocMeta.setdocmeta!(WhatsThePoint, :DocTestSetup, :(using WhatsThePoint); recursive=true)
            doctest(WhatsThePoint)'
